- title: "Persona Following Is Not Selective Control: The Neutrality Gap in LLM User Simulation"
  url: "https://arxiv.org/abs/2609.35036"
  authors: "Jiashen Ren, Wenlin Zhang, Bohan Zhang, Xiaopeng Li, Zichuan Fu, Wanyu Wang, Junyi Li, Xiangyu Zhao"
  tag: "Preprint"
  venue: "arXiv:2609.35036, 2026"
  image: "/images/publications/persona-following.png"
  summary: "Changing one persona attribute also shifts attributes the prompt never mentions. Declaring those attributes neutral does not stop it, so following a persona is not the same as controlling it."
